# Push a tag like v0.6.0 (matching manifest.json's version) to publish a GitHub Release with
# the built extension as a zip. No Chrome Web Store.
# Two jobs: the build installs dependencies and runs scripts with read-only access; only the
# publish step, which runs no project code, may write (create the release).
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - id: zip
        run: echo "path=$(node scripts/release-zip.mjs "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-zip
          path: ${{ steps.zip.outputs.path }}
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-zip
      # The artifact holds exactly one zip; nothing from the build job is put into this shell.
      - run: |
          shopt -s nullglob
          zips=(./*.zip)
          [ "${#zips[@]}" -eq 1 ] || { echo "expected one zip, got ${#zips[@]}"; exit 1; }
          gh release create "$GITHUB_REF_NAME" "${zips[0]}" --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
